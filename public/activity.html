<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Activity Detail — SiteBridge AI</title>
  <script>
    (function() {
      var t = localStorage.getItem('sitebridge_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main>
    <div style="margin-bottom:16px;">
      <a href="schedule.html" class="muted" style="font-size:14px; text-decoration:none; font-weight:500;">&larr; Back to Schedule Baseline</a>
    </div>
    <div id="content"></div>
  </main>
  <script src="app.js?v=2.2"></script>
  <script>
    renderTopbar('schedule.html');
    const id = new URLSearchParams(location.search).get('id');
    const el = document.getElementById('content');

    (async () => {
      if (!id) {
        el.innerHTML = '<div class="card muted">No activity specified in URL parameter. <a href="schedule.html" style="color:var(--accent)">Return to Schedule</a></div>';
        return;
      }

      try {
        const a = await api(`/schedule/${id}`);
        const v = calculateScheduleVariance(a);

        el.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-bottom:12px;">
            <div>
              <h1 style="margin-bottom:4px;">${escapeHtml(a.wbs_code)} — ${escapeHtml(a.description)}</h1>
              <p class="sub" style="margin-bottom:0;">
                Discipline: <span class="badge" style="background:rgba(59,130,246,0.1); color:var(--accent)">${escapeHtml(a.discipline)}</span> &bull; 
                Status: <span class="badge ${a.status}">${escapeHtml(a.status ? a.status.replace('_',' ') : 'not started')}</span>
              </p>
            </div>
            <div>
              <span class="${v.badgeClass}" style="font-size:13px; padding:6px 14px; font-weight:700;">${v.varianceLabel}</span>
            </div>
          </div>

          <!-- Timeline Variance & Activity Progress Card -->
          <div class="card card-highlight" style="margin-bottom:16px; border-left:4px solid ${v.bannerColor};">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:14px;">
              <div>
                <b style="font-size:16px;">Timeline Schedule Variance &amp; Progress</b>
                <span class="sub" style="display:block; margin:2px 0 0 0; font-size:12px;">Analyzed with respect to origin baseline timeline.</span>
              </div>
              <div style="text-align:right;">
                <span class="muted" style="font-size:12px;">Percentage of Activity Done:</span>
                <div style="font-size:22px; font-weight:800; color:${v.pctDone === 100 ? 'var(--good)' : v.pctDone > 0 ? 'var(--warn)' : 'var(--muted)'};">
                  ${v.pctDone}%
                </div>
              </div>
            </div>

            <!-- Percentage Progress Bar -->
            <div class="score-bar" style="height:10px; margin-bottom:16px;">
              <div class="score-fill" style="width:${v.pctDone}%; background:${v.pctDone === 100 ? 'var(--good)' : 'linear-gradient(90deg, #3b82f6, #10b981)'};"></div>
            </div>

            <div class="row" style="gap:12px;">
              <div style="background:var(--card-sub); padding:14px; border-radius:8px; border:1px solid var(--border); flex:1;">
                <label style="margin-top:0">Origin Baseline Timeline</label>
                <div style="font-size:15px; font-weight:700; color:var(--text);">
                  ${escapeHtml(a.planned_start || 'Not set')} &rarr; ${escapeHtml(a.planned_end || 'Not set')}
                </div>
                <div class="muted" style="font-size:12px; margin-top:4px;">
                  Planned Duration: <b>${v.plannedDays ? v.plannedDays + ' days' : 'N/A'}</b>
                </div>
              </div>

              <div style="background:var(--card-sub); padding:14px; border-radius:8px; border:1px solid var(--border); flex:1;">
                <label style="margin-top:0">Actual Schedule Window</label>
                <div style="font-size:15px; font-weight:700; color:${a.actual_end ? 'var(--good)' : a.actual_start ? 'var(--warn)' : 'var(--muted)'};">
                  ${escapeHtml(a.actual_start || 'Not started')} &rarr; ${escapeHtml(a.actual_end || (a.actual_start ? 'In progress' : 'Not started'))}
                </div>
                <div class="muted" style="font-size:12px; margin-top:4px;">
                  Actual / Elapsed: <b>${v.actualDays ? v.actualDays + ' days' : '0 days'}</b>
                </div>
              </div>

              <div style="background:var(--card-sub); padding:14px; border-radius:8px; border:1px solid var(--border); flex:1;">
                <label style="margin-top:0">Schedule Compliance</label>
                <div style="font-size:15px; font-weight:700; color:${v.bannerColor};">
                  ${v.varianceLabel}
                </div>
                <div class="muted" style="font-size:12px; margin-top:4px;">
                  ${v.varianceDays > 0 ? `+${v.varianceDays} days behind baseline` : v.varianceDays < 0 ? `${Math.abs(v.varianceDays)} days ahead of schedule` : 'Tracking on baseline schedule'}
                </div>
              </div>
            </div>
          </div>

          <div class="card">
            <b style="font-size:15px; display:block; margin-bottom:12px">Linked Field Report Events</b>
            ${a.linked_events.length ? a.linked_events.map(e => `
              <div class="result-item">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <div>
                    <b style="font-size:14px">${escapeHtml(e.activity_description)}</b>
                    <span class="badge ${e.status}">${escapeHtml(e.status)}</span>
                    <span class="badge" style="background:rgba(255,255,255,0.06); color:var(--muted); font-size:10px">${escapeHtml(e.event_type)}</span>
                  </div>
                  <span class="pill">${Math.round((e.similarity_score||0)*100)}% match</span>
                </div>
                <div class="muted" style="font-size:12px; margin-top:6px">
                  Extracted Date: <b>${escapeHtml(e.extracted_date)}</b> &bull; Source: ${escapeHtml(e.source_type)} &bull; Submitted by: <b>${escapeHtml(e.submitted_by_name || 'Unknown')}</b> &bull; Logged: ${escapeHtml(e.created_at)}
                </div>
              </div>`).join('')
              : '<div class="muted" style="padding:12px 0;">No field actual events confirmed or linked to this baseline activity yet.</div>'}
          </div>

          <div class="card">
            <b style="font-size:15px; display:block; margin-bottom:12px">Activity Audit History</b>
            <table>
              <thead>
                <tr><th>Action</th><th>Details</th><th>Timestamp</th></tr>
              </thead>
              <tbody>
                ${a.audit_trail.map(l => `
                  <tr>
                    <td><span class="badge ${l.action==='confirmed'?'confirmed':l.action==='rejected'?'rejected':'pending'}">${escapeHtml(l.action)}</span></td>
                    <td class="muted">${escapeHtml(l.details || '')}</td>
                    <td class="muted" style="font-size:12px">${escapeHtml(l.created_at)}</td>
                  </tr>
                `).join('') || '<tr><td colspan="3" class="muted">No audit history entries found for this activity.</td></tr>'}
              </tbody>
            </table>
          </div>`;
      } catch (err) {
        el.innerHTML = `<div class="card" style="border-color:var(--bad); background:var(--bad-bg)"><b style="color:var(--bad)">Error fetching activity:</b> ${escapeHtml(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
